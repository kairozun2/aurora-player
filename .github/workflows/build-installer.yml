name: Build the Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-installer
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Start the build log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          Set-Content ci-logs/build.log "the build started"
          Add-Content ci-logs/build.log "commit: $env:GITHUB_SHA"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.2
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtmultimedia qtimageformats
          cache: true

      - name: Configure the project
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAURORA_BUILD_GUI=ON -DAURORA_BUILD_CLI=ON -DAURORA_BUILD_TESTS=OFF 2>&1 | Tee-Object -FilePath ci-logs/configure.txt
          if ($LASTEXITCODE -ne 0) { throw "the project could not be configured" }

      - name: Compile the project
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath ci-logs/compile.txt
          if ($LASTEXITCODE -ne 0) { throw "the project could not be compiled" }

      - name: Collect the runtime next to the executable
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter aurora-player.exe | Select-Object -First 1
          if (-not $exe) { throw "the executable was not produced by the compiler" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist/
          windeployqt --release --no-translations --compiler-runtime --qmldir app/qml dist/aurora-player.exe 2>&1 | Tee-Object -FilePath ci-logs/deploy.txt
          Copy-Item i18n dist/i18n -Recurse -Force
          foreach ($needed in @("dist/platforms/qwindows.dll", "dist/Qt6Core.dll", "dist/Qt6Quick.dll")) {
            if (-not (Test-Path $needed)) { throw "the Qt runtime is incomplete: $needed is missing" }
          }
          Get-ChildItem dist -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path dist).Path.Length + 1) } | Sort-Object | Set-Content ci-logs/dist-listing.txt

      - name: Add ffmpeg and yt-dlp next to the application
        shell: pwsh
        run: |
          $tools = "dist/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          try {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$tools/yt-dlp.exe" -UseBasicParsing
            Write-Host "yt-dlp is bundled"
          } catch {
            Write-Host "yt-dlp could not be downloaded"
          }
          try {
            $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
            $out = Join-Path $env:RUNNER_TEMP "ffmpeg"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $out -Force
            Get-ChildItem -Path $out -Recurse -Include ffmpeg.exe, ffprobe.exe | ForEach-Object { Copy-Item $_.FullName -Destination $tools -Force }
            Write-Host "ffmpeg is bundled"
          } catch {
            Write-Host "ffmpeg could not be downloaded"
          }
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          Get-ChildItem $tools | Select-Object Name, Length | Format-Table | Out-String |
              Tee-Object -FilePath ci-logs/tools-listing.txt | Write-Host

      - name: Start the application and confirm that it opens
        id: smoketest
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:AURORA_NO_DIALOGS = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist/aurora-player.exe -ArgumentList "--selftest" -PassThru -RedirectStandardError ci-logs/selftest-stderr.txt -RedirectStandardOutput ci-logs/selftest-stdout.txt
          $finished = $p.WaitForExit(90000)
          if (-not $finished) { $p.Kill(); $p.WaitForExit() }
          $log = Join-Path $env:APPDATA "AuroraAudio/Aurora Player/startup.log"
          if (Test-Path $log) { Copy-Item $log ci-logs/startup-raw.log }
          if (-not $finished) {
            Set-Content ci-logs/selftest-result.txt "FAILED: the application hung and was killed"
            throw "the application did not finish starting"
          }
          $code = $p.ExitCode
          if ($code -ne 0) {
            Set-Content ci-logs/selftest-result.txt "FAILED: exit code $code"
            throw "the application refused to start, exit code $code"
          }
          Set-Content ci-logs/selftest-result.txt "PASSED: the window opened and the application exited cleanly"

      - name: Record every log in the repository
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          function Write-Digest($source, $target) {
            if (-not (Test-Path $source)) { return }
            $info = Get-Item $source
            $lines = Get-Content $source -TotalCount 20000
            $out = New-Object System.Collections.Generic.List[string]
            $out.Add("source: " + $info.Name + "  (" + $info.Length + " bytes)")
            $out.Add("--- first 60 lines ---")
            foreach ($l in ($lines | Select-Object -First 60)) { $out.Add($l) }
            $out.Add("--- the 15 most repeated lines ---")
            $groups = $lines | Group-Object | Sort-Object Count -Descending | Select-Object -First 15
            foreach ($g in $groups) { $out.Add(($g.Count.ToString() + " x  " + $g.Name)) }
            $out.Add("--- last 40 lines ---")
            foreach ($l in (Get-Content $source -Tail 40)) { $out.Add($l) }
            Set-Content $target $out
          }
          Write-Digest "ci-logs/startup-raw.log" "ci-logs/startup-digest.txt"
          Write-Digest "ci-logs/selftest-stderr.txt" "ci-logs/selftest-stderr-digest.txt"
          Write-Digest "ci-logs/selftest-stdout.txt" "ci-logs/selftest-stdout-digest.txt"
          foreach ($raw in @("ci-logs/startup-raw.log", "ci-logs/selftest-stderr.txt", "ci-logs/selftest-stdout.txt", "ci-logs/startup.log")) {
            if (Test-Path $raw) { Remove-Item $raw -Force }
          }
          foreach ($big in @("configure", "compile", "deploy")) {
            $file = "ci-logs/$big.txt"
            if (Test-Path $file) { Get-Content $file -Tail 150 | Set-Content "ci-logs/$big-tail.txt"; Remove-Item $file }
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f ci-logs
          if (-not (git status --porcelain)) { exit 0 }
          git commit -m "CI: record the build and startup logs"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build the portable archive
        if: steps.smoketest.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          Compress-Archive -Path dist/* -DestinationPath dist-installer/AuroraPlayer-1.1.0-win64-portable.zip -Force

      - name: Adjust the installer script
        if: steps.smoketest.outcome == 'success'
        shell: pwsh
        run: |
          $path = "packaging/installer/aurora-player.iss"
          $text = Get-Content $path -Raw
          $text = $text.Replace(" isreadme", "").Replace("; Tasks: desktopicon", "").Replace('#define MyAppVersion "1.0.0"', '#define MyAppVersion "1.1.0"')
          Set-Content $path $text
          if ($text -match "isreadme") { throw "the readme flag is still present" }

      - name: Compile the installer
        if: steps.smoketest.outcome == 'success'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer/aurora-player.iss
          Get-ChildItem dist-installer

      - name: Publish the release
        if: steps.smoketest.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Aurora Player 1.1.0
          make_latest: true
          files: |
            dist-installer/AuroraPlayer-1.1.0-win64-setup.exe
            dist-installer/AuroraPlayer-1.1.0-win64-portable.zip
          body: |
            Aurora Player 1.1.0 for Windows.

            Before these files were uploaded the build server started the
            application itself and waited for the main window to open. The
            upload only happens when that check passes.

            - AuroraPlayer-1.1.0-win64-setup.exe - installer, no administrator rights needed.
            - AuroraPlayer-1.1.0-win64-portable.zip - unpack anywhere, run aurora-player.exe.
