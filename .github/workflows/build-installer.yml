name: Build Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Build and publish setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report that the run has started
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          "the installer workflow started at $(Get-Date -Format u)" | Set-Content .ci/last-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/last-run.txt
          git commit -m 'CI beacon: the installer workflow started'
          git push origin HEAD:main
          exit 0

      - name: Import the project source from the public repository
        shell: pwsh
        run: |
          if (Test-Path core/src/AudioEngine.cpp) {
            Write-Host 'Source already present, skipping the import'
          }
          else {
            git clone --depth 1 https://github.com/skaisayyy/ewfest.git source
            robocopy source . /E /XD .git /XF AuroraButton.qml SettingsView.qml /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
            Remove-Item source -Recurse -Force
          }
          exit 0

      - name: Check the UI file set
        shell: pwsh
        run: |
          Write-Host "QML files: $((Get-ChildItem app/qml -Filter *.qml).Count)"
          foreach ($name in @('AuroraButton.qml', 'SettingsView.qml')) {
            if (-not (Test-Path (Join-Path 'app/qml' $name))) { throw "$name is missing" }
          }

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAURORA_BUILD_GUI=ON -DAURORA_BUILD_CLI=ON -DAURORA_BUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stage the application and deploy the Qt runtime
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          cmake --install build --config Release --prefix dist
          $distPath = (Resolve-Path dist).Path
          $exe = Get-ChildItem -Path dist -Recurse -Filter aurora-player.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $built = Get-ChildItem -Path build -Recurse -Filter aurora-player.exe | Select-Object -First 1
            if (-not $built) { throw 'aurora-player.exe was not produced by the build' }
            Copy-Item $built.FullName dist -Force
          }
          elseif ($exe.DirectoryName -ne $distPath) {
            Copy-Item (Join-Path $exe.DirectoryName '*') dist -Recurse -Force
          }
          if (-not (Test-Path dist/aurora-player.exe)) { throw 'aurora-player.exe is not at the root of dist' }
          $wdq = Get-Command windeployqt -ErrorAction SilentlyContinue
          if ($wdq) { $wdqPath = $wdq.Source }
          else {
            $root = $env:QT_ROOT_DIR
            if (-not $root) { $root = 'C:\' }
            $found = Get-ChildItem -Path $root -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw 'windeployqt.exe was not found on the runner' }
            $wdqPath = $found.FullName
          }
          Write-Host "using windeployqt at $wdqPath"
          & $wdqPath --release --no-translations --compiler-runtime --qmldir app/qml (Join-Path $distPath 'aurora-player.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          foreach ($required in @('platforms/qwindows.dll', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Quick.dll')) {
            if (-not (Test-Path (Join-Path 'dist' $required))) { throw "the deployed runtime is incomplete: $required is missing" }
          }
          Write-Host 'the Qt platform plugin and core libraries are present'
          if (-not (Test-Path dist/i18n)) { Copy-Item -Recurse i18n dist/i18n -Force }
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          Get-ChildItem dist -Recurse -File | ForEach-Object { $_.FullName.Substring($distPath.Length + 1) } | Sort-Object | Set-Content ci-logs/dist-listing.txt
          Write-Host "staged files: $((Get-Content ci-logs/dist-listing.txt).Count)"

      - name: Record the staged file list in the repository
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path ci-logs/dist-listing.txt)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-logs/dist-listing.txt
          git commit -m 'CI: record the staged file list'
          git push origin HEAD:main
          exit 0

      - name: Build the portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          Compress-Archive -Path dist/* -DestinationPath dist-installer/AuroraPlayer-1.0.2-win64-portable.zip -Force
          Get-ChildItem dist-installer

      - name: Adjust the installer script
        shell: pwsh
        run: |
          $iss = 'packaging/installer/aurora-player.iss'
          $text = Get-Content $iss -Raw
          $original = $text
          $text = $text.Replace(' isreadme', '')
          $text = $text.Replace('; Tasks: desktopicon', '')
          $text = $text.Replace('#define MyAppVersion "1.0.0"', '#define MyAppVersion "1.0.2"')
          if ($text -eq $original) { throw 'the installer script did not contain the expected entries' }
          Set-Content -Path $iss -Value $text -NoNewline
          if ($text -match 'isreadme') { throw 'the readme flag is still present' }
          if ($text -match 'Tasks: desktopicon') { throw 'the desktop shortcut is still optional' }
          Write-Host 'the installer no longer opens the readme and always creates a desktop shortcut'

      - name: Compile the installer with Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc packaging\installer\aurora-player.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem dist-installer -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'the installer was not produced' }
          $target = Join-Path $setup.DirectoryName 'AuroraPlayer-1.0.2-win64-setup.exe'
          if ($setup.FullName -ne $target) { Move-Item $setup.FullName $target -Force }
          Get-ChildItem dist-installer

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-win64-setup
          path: dist-installer/*
          if-no-files-found: error

      - name: Publish the release with the installer attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Aurora Player 1.0.2
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist-installer/AuroraPlayer-1.0.2-win64-setup.exe
            dist-installer/AuroraPlayer-1.0.2-win64-portable.zip
          body: |
            Aurora Player 1.0.2 for Windows.

            Fixed in this build:
            - the Qt runtime, including the Windows platform plugin, is always deployed and verified,
              so the application no longer fails with "no Qt platform plugin could be initialized";
            - the installer no longer opens README.md in a text editor when it finishes;
            - the desktop shortcut is always created.

            Two ways to run it:
            - AuroraPlayer-1.0.2-win64-setup.exe - the installer, no administrator rights needed;
            - AuroraPlayer-1.0.2-win64-portable.zip - unpack anywhere and run aurora-player.exe.
